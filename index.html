<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f2a" />
    <title>Spark Island · vibeCDA starter</title>
  </head>
  <body>
    <main>
      <nav aria-label="Starter examples">
        <a href="?demo=2d">Phaser 2D game</a>
        <a href="?demo=3d">Three.js 3D demo</a>
      </nav>
      <header>
        <p class="eyebrow">vibeCDA starter / Phaser 2D</p>
        <h1>Spark <span class="accent">Island</span></h1>
        <p class="lead">A wizard, a lizard, and a floating island. Collect all eight sparks.</p>
      </header>
      <div class="toolbar">
        <p id="score" role="status" aria-live="polite">Sparks: 0 / 8</p>
        <button id="restart" type="button">Restart game</button>
      </div>
      <div id="game" role="application" aria-label="Spark Island game. Move using arrow keys or W A S D, or hold a location on the game."></div>
      <p id="instructions">Move with <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>. On a phone, hold where you want to go.</p>
      <footer>Start changing <code>src/game.ts</code>. Your idea goes here.</footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
